# Primary sink: index jobs into the mutu.dev Elasticsearch service. Airtable
# stays available as a fallback (set JOBSYNC_SINK=airtable + the Airtable secrets).
JOBSYNC_SINK: "elasticsearch"
JOBSYNC_ES_URL: "https://job-hunt-elasticsearch-274835708611.us-east1.run.app"
JOBSYNC_ES_INDEX: "jobs_v2"
JOBSYNC_ES_EMBEDDINGS: "true"
AIRTABLE_TABLE_NAME: "Jobs"
JOBSYNC_LOOKBACK_HOURS: "24"
JOBSYNC_US_ONLY: "true"
JOBSYNC_ENABLE_FAST_PATH: "false"
JOBSYNC_BRANDED_OUTPUT: "true"
# Persist cache + app state in Firestore (Cloud Run's filesystem is ephemeral).
# projectId is auto-detected from the runtime's ADC; set FIRESTORE_DATABASE_ID
# only if you use a non-default database.
JOBSYNC_STORAGE_BACKEND: "firestore"
JOBSYNC_RESPONSE_CACHE_TTL_HOURS: "6"
