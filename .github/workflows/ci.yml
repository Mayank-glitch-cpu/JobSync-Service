name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - 'pnpm-lock.yaml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Use corepack (built into Node) to provide the pnpm version pinned in
      # package.json's `packageManager`. Avoids pnpm/action-setup@v4, whose
      # self-installer crashes parsing this repo's onlyBuiltDependencies config
      # (`onlyBuiltDependencies?.sort is not a function`).
      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter jobsync-mcp typecheck

      - name: Build
        run: pnpm --filter jobsync-mcp build

      - name: Test
        run: pnpm --filter jobsync-mcp test
