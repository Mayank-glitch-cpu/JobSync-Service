name: Daily Job Pipeline

on:
  schedule:
    # Run daily at 8:00 AM UTC (3:00 AM EST)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      keywords:
        description: 'Comma-separated keywords to filter by (blank = default from env: software,robotics,manufacturing,data analyst,sde,early career)'
        required: false
        type: string
      limit:
        description: 'Max jobs to fetch (blank = default from env)'
        required: false
        type: string
      posted_today:
        description: 'Only fetch jobs posted today (true/false, default: false)'
        required: false
        type: boolean
        default: false
      published_within_hours:
        description: 'Lookback window in hours (blank = default 24)'
        required: false
        type: string

env:
  BACKEND_URL: ${{ secrets.BACKEND_URL }}
  PIPELINE_API_KEY: ${{ secrets.PIPELINE_API_KEY }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Trigger full pipeline
        id: trigger
        run: |
          URL="${BACKEND_URL}/api/pipeline/run-all"

          # Build curl args — use --data-urlencode for proper encoding of spaces
          CURL_ARGS=(-s -w "\n%{http_code}" -X POST -G)
          CURL_ARGS+=(-H "x-api-key: ${PIPELINE_API_KEY}")

          if [ -n "${{ inputs.keywords }}" ]; then
            CURL_ARGS+=(--data-urlencode "keywords=${{ inputs.keywords }}")
          fi
          if [ "${{ inputs.posted_today }}" = "true" ]; then
            CURL_ARGS+=(--data-urlencode "postedToday=true")
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            CURL_ARGS+=(--data-urlencode "limit=${{ inputs.limit }}")
          fi
          if [ -n "${{ inputs.published_within_hours }}" ]; then
            CURL_ARGS+=(--data-urlencode "publishedWithinHours=${{ inputs.published_within_hours }}")
          fi

          echo "Triggering: $URL"

          RESPONSE=$(curl "${CURL_ARGS[@]}" "$URL")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Pipeline trigger failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Poll for completion
        run: |
          MAX_ATTEMPTS=60  # 60 * 30s = 30 minutes max
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))

            STATUS=$(curl -s "${BACKEND_URL}/api/pipeline/status" \
              -H "x-api-key: ${PIPELINE_API_KEY}")

            echo "Attempt $ATTEMPT: $STATUS"

            # Check if any step has error
            if echo "$STATUS" | jq -e '.step1.status == "error" or .step2.status == "error" or .step3.status == "error" or .step4.status == "error"' > /dev/null 2>&1; then
              echo "::error::Pipeline failed. Status: $STATUS"
              exit 1
            fi

            # Check if step4 is completed (all done)
            if echo "$STATUS" | jq -e '.step4.status == "completed"' > /dev/null 2>&1; then
              echo "Pipeline completed successfully!"
              echo "$STATUS" | jq .
              exit 0
            fi

            sleep 30
          done

          echo "::error::Pipeline timed out after 30 minutes"
          exit 1

      - name: Report results
        if: always()
        run: |
          STATUS=$(curl -s "${BACKEND_URL}/api/pipeline/status" \
            -H "x-api-key: ${PIPELINE_API_KEY}")

          echo "## Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$STATUS" | jq . >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
