name: Google Sheets Pipeline

on:
  schedule:
    # 4:00 AM EST = 9:00 AM UTC, 2:00 PM EST = 7:00 PM UTC
    - cron: '0 9,19 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max jobs to fetch (default: 10)'
        required: false
        type: string

env:
  BACKEND_URL: ${{ secrets.BACKEND_URL }}
  PIPELINE_API_KEY: ${{ secrets.PIPELINE_API_KEY }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Trigger Google Sheets pipeline
        id: trigger
        run: |
          URL="${BACKEND_URL}/api/pipeline/run-all"

          CURL_ARGS=(-s -w "\n%{http_code}" -X POST -G)
          CURL_ARGS+=(-H "x-api-key: ${PIPELINE_API_KEY}")
          CURL_ARGS+=(--data-urlencode "source=csv")
          CURL_ARGS+=(--data-urlencode "limit=${{ inputs.limit || '10' }}")

          echo "Triggering Google Sheets pipeline: $URL"

          RESPONSE=$(curl "${CURL_ARGS[@]}" "$URL")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Pipeline trigger failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Poll for completion
        run: |
          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))

            STATUS=$(curl -s "${BACKEND_URL}/api/pipeline/status" \
              -H "x-api-key: ${PIPELINE_API_KEY}")

            echo "Attempt $ATTEMPT: $STATUS"

            if echo "$STATUS" | jq -e '.step1.status == "error" or .step2.status == "error" or .step3.status == "error" or .step4.status == "error"' > /dev/null 2>&1; then
              echo "::error::Pipeline failed. Status: $STATUS"
              exit 1
            fi

            if echo "$STATUS" | jq -e '.step4.status == "completed"' > /dev/null 2>&1; then
              echo "Pipeline completed successfully!"
              echo "$STATUS" | jq .
              exit 0
            fi

            sleep 30
          done

          echo "::error::Pipeline timed out after 30 minutes"
          exit 1

      - name: Report results
        if: always()
        run: |
          STATUS=$(curl -s "${BACKEND_URL}/api/pipeline/status" \
            -H "x-api-key: ${PIPELINE_API_KEY}")

          echo "## Google Sheets Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$STATUS" | jq . >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
