services:
  - type: web
    name: jobsync-mcp
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter jobsync-mcp build
    startCommand: cd mcp-server && node dist/http.js
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: PORT
        value: 3000
      - key: JOBSYNC_REMOTE_BEARER_TOKEN
        sync: false
      - key: JOBSYNC_SINK
        value: airtable
      - key: AIRTABLE_API_KEY
        sync: false
      - key: AIRTABLE_BASE_ID
        sync: false
      - key: AIRTABLE_TABLE_NAME
        value: Jobs
